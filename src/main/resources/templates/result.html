<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div class="wrap">
  <div class="card">
    <h1>Result - <span th:text="${name}"></span></h1>
    <div class="stats">
      <div class="stat"><b th:text="${correct} + '/' + ${total}"></b>Sahi</div>
      <div class="stat"><b th:text="${wrong}"></b>Galat</div>
      <div class="stat"><b th:text="${skipped}"></b>Skip</div>
      <div class="stat"><b th:text="${accuracy} + '%'"></b>Accuracy</div>
      <div class="stat"><b th:text="${totalTime} + 's'"></b>Total time</div>
      <div class="stat"><b th:text="${avgTime} + 's'"></b>Avg / question</div>
    </div>
  </div>
  <div class="card">
    <h2>Question wise report dakh lodu </h2>
    <table>
      <tr><th>#</th><th>Question</th><th>your answer</th><th>Sahi jawab</th><th>Time</th><th></th></tr>
      <tr th:each="r, i : ${rows}">
        <td th:text="${i.count}"></td>
        <td th:text="${r.text}"></td>
        <td th:text="${r.yours}"></td>
        <td th:text="${r.right}"></td>
        <td th:text="${r.time} + 's'"></td>
        <td>
          <span th:if="${r.status == 'ok'}" class="ok">Sahi</span>
          <span th:if="${r.status == 'bad'}" class="bad">Galat</span>
          <span th:if="${r.status == 'skip'}" class="skip">Skip</span>
        </td>
      </tr>
    </table>
  </div>
  <a class="btn" th:href="@{/}">dubara test de bsdk </a>
</div></body></html>
